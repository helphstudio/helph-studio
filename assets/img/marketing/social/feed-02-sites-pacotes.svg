  <text x="72" y="1040" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" opacity="0.9">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
  <text x="1008" y="1040" font-family="Arial, sans-serif" font-size="22" fill="#8888a0" text-anchor="end">helphstudio.com.br</text>
