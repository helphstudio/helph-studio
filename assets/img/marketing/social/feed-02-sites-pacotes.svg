  <text x="778" y="520" font-family="Arial, sans-serif" font-size="21" fill="#8888a0">✓ Galeria / portfólio</text>
  <text x="778" y="556" font-family="Arial, sans-serif" font-size="21" fill="#8888a0">✓ Blog / novidades</text>
  <text x="778" y="592" font-family="Arial, sans-serif" font-size="21" fill="#8888a0">✓ 1 mês manutenção</text>
