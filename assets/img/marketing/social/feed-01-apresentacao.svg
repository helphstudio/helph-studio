<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0a0a0f"/>
  <rect width="1080" height="1080" fill="url(#bg-glow)"/>

  <!-- Decorative circles -->
  <circle cx="980" cy="100" r="280" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.1"/>
  <circle cx="980" cy="100" r="200" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.07"/>
  <circle cx="100" cy="980" r="240" fill="none" stroke="#7c5cfc" stroke-width="1" opacity="0.08"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1080" height="5" fill="url(#top-bar)"/>

  <!-- Left accent line -->
  <rect x="72" y="80" width="4" height="120" rx="2" fill="#7c5cfc" opacity="0.8"/>

  <!-- Label -->
  <text x="96" y="118" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#a78bfa" letter-spacing="4" text-transform="uppercase">HELPH STUDIO</text>
  <text x="96" y="150" font-family="Arial, sans-serif" font-size="20" fill="#8888a0" letter-spacing="2">Presença digital para quem quer crescer</text>

  <!-- Main headline -->
  <text x="72" y="320" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="96" fill="#f0f0f5" letter-spacing="-2">Seu negócio</text>
  <text x="72" y="425" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="96" fill="#f0f0f5" letter-spacing="-2">está onde</text>
  <text x="72" y="530" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="96" fill="#a78bfa" letter-spacing="-2">seus clientes</text>
  <text x="72" y="635" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="96" fill="#f0f0f5" letter-spacing="-2">estão?</text>

  <!-- Divider -->
  <rect x="72" y="665" width="100" height="4" rx="2" fill="#7c5cfc"/>

  <!-- Description -->
  <text x="72" y="712" font-family="Arial, sans-serif" font-size="28" fill="#8888a0">Sites profissionais e aplicativos que geram</text>
  <text x="72" y="748" font-family="Arial, sans-serif" font-size="28" fill="#8888a0">credibilidade e atraem clientes 24h por dia.</text>

  <!-- Service pills -->
  <!-- Pill 1: Sites -->
  <rect x="72" y="790" width="200" height="48" rx="24" fill="url(#pill-bg)"/>
  <rect x="72" y="790" width="200" height="48" rx="24" fill="none" stroke="#7c5cfc" stroke-width="1.5" opacity="0.5"/>
  <text x="172" y="820" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#a78bfa" text-anchor="middle">🌐 Sites</text>

  <!-- Pill 2: Helph Booking -->
  <rect x="288" y="790" width="300" height="48" rx="24" fill="url(#pill-bg)"/>
  <rect x="288" y="790" width="300" height="48" rx="24" fill="none" stroke="#7c5cfc" stroke-width="1.5" opacity="0.5"/>
  <text x="438" y="820" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#a78bfa" text-anchor="middle">📅 Helph Booking</text>

  <!-- Pill 3: Apps Web -->
  <rect x="604" y="790" width="220" height="48" rx="24" fill="url(#pill-bg)"/>
  <rect x="604" y="790" width="220" height="48" rx="24" fill="none" stroke="#7c5cfc" stroke-width="1.5" opacity="0.5"/>
  <text x="714" y="820" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#a78bfa" text-anchor="middle">📱 Apps Web</text>

  <!-- Bottom bar -->
  <rect x="0" y="980" width="1080" height="100" fill="#111118"/>
  <rect x="0" y="978" width="1080" height="2" fill="#7c5cfc" opacity="0.3"/>

  <!-- Logo watermark -->
  <text x="72" y="1040" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" opacity="0.9">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
  <text x="1008" y="1040" font-family="Arial, sans-serif" font-size="22" fill="#8888a0" text-anchor="end">helphstudio.com.br</text>
</svg>
