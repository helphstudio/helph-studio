  <text x="540" y="1860" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="36" fill="#f0f0f5" text-anchor="middle" opacity="0.5">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
