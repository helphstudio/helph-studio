<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0a0a0f"/>
  <rect width="1080" height="1080" fill="url(#bg-glow)"/>

  <!-- Decorative circles -->
  <circle cx="540" cy="480" r="380" fill="none" stroke="#7c5cfc" stroke-width="1" opacity="0.12"/>
  <circle cx="540" cy="480" r="460" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.06"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1080" height="5" fill="url(#top-bar)"/>

  <!-- Label top -->
  <text x="540" y="120" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#a78bfa" letter-spacing="5" text-anchor="middle">VOCÊ SABIA?</text>

  <!-- Big stat number -->
  <text x="540" y="460" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="340" fill="#a78bfa" text-anchor="middle" opacity="0.95">81%</text>

  <!-- Divider -->
  <rect x="340" y="500" width="400" height="4" rx="2" fill="#7c5cfc" opacity="0.6"/>

  <!-- Stat description -->
  <text x="540" y="570" font-family="Arial Black, sans-serif" font-weight="900" font-size="38" fill="#f0f0f5" text-anchor="middle">dos consumidores pesquisam</text>
  <text x="540" y="618" font-family="Arial Black, sans-serif" font-weight="900" font-size="38" fill="#f0f0f5" text-anchor="middle">online <tspan fill="#a78bfa">antes de comprar</tspan></text>

  <!-- Question -->
  <text x="540" y="710" font-family="Arial, sans-serif" font-size="30" fill="#8888a0" text-anchor="middle">E o seu negócio aparece nesses resultados?</text>

  <!-- CTA box -->
  <rect x="240" y="760" width="600" height="72" rx="36" fill="#7c5cfc" opacity="0.15"/>
  <rect x="240" y="760" width="600" height="72" rx="36" fill="none" stroke="#7c5cfc" stroke-width="2" opacity="0.5"/>
  <text x="540" y="804" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#a78bfa" text-anchor="middle">A gente coloca você lá ✓</text>

  <!-- Bottom bar -->
  <rect x="0" y="980" width="1080" height="100" fill="#111118"/>
  <rect x="0" y="978" width="1080" height="2" fill="#7c5cfc" opacity="0.3"/>
  <text x="72" y="1040" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" opacity="0.9">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
  <text x="1008" y="1040" font-family="Arial, sans-serif" font-size="22" fill="#8888a0" text-anchor="end">helphstudio.com.br</text>
</svg>
