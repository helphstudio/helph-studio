<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="featured" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="cta-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="#0a0a0f"/>
  <rect width="1080" height="1920" fill="url(#bg-glow)"/>
  <circle cx="950" cy="250" r="300" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.1"/>
  <rect x="0" y="0" width="1080" height="6" fill="url(#top-bar)"/>

  <!-- Top logo -->
  <text x="540" y="180" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="48" fill="#f0f0f5" text-anchor="middle">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>

  <!-- Title -->
  <text x="540" y="330" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#a78bfa" letter-spacing="4" text-anchor="middle">PACOTES DE SITES</text>
  <text x="540" y="430" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="88" fill="#f0f0f5" text-anchor="middle" letter-spacing="-2">Sites que</text>
  <text x="540" y="528" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="88" fill="#a78bfa" text-anchor="middle" letter-spacing="-2">convertem.</text>

  <text x="540" y="596" font-family="Arial, sans-serif" font-size="30" fill="#8888a0" text-anchor="middle">Design exclusivo · Sem template</text>
  <text x="540" y="636" font-family="Arial, sans-serif" font-size="30" fill="#8888a0" text-anchor="middle">Entrega em 7 dias · 3 meses suporte</text>

  <!-- Urgency -->
  <rect x="190" y="666" width="700" height="52" rx="26" fill="rgba(124,92,252,0.12)"/>
  <rect x="190" y="666" width="700" height="52" rx="26" fill="none" stroke="#7c5cfc" stroke-width="1.5" opacity="0.5"/>
  <text x="540" y="700" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#a78bfa" text-anchor="middle">⏳ Oferta de lançamento — vagas limitadas</text>

  <!-- Plan cards vertical -->
  <!-- Card 1: Presença -->
  <rect x="80" y="740" width="920" height="180" rx="20" fill="rgba(255,255,255,0.03)"/>
  <rect x="80" y="740" width="920" height="180" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="180" y="812" font-family="Arial Black, sans-serif" font-weight="900" font-size="36" fill="#f0f0f5">Pacote Presença</text>
  <text x="180" y="852" font-family="Arial, sans-serif" font-size="24" fill="#8888a0">Landing page · Design exclusivo · SEO</text>
  <text x="180" y="892" font-family="Arial, sans-serif" font-size="20" fill="#8888a0" text-decoration="line-through">R$ 1.200,00</text>
  <text x="840" y="856" font-family="Arial Black, sans-serif" font-weight="900" font-size="44" fill="#22c55e" text-anchor="middle">R$599</text>
  <text x="900" y="892" font-family="Arial, sans-serif" font-size="20" fill="#8888a0">,90</text>

  <!-- Card 2: Profissional (featured) -->
  <rect x="80" y="940" width="920" height="210" rx="20" fill="url(#featured)"/>
  <rect x="80" y="940" width="920" height="210" rx="20" fill="none" stroke="#7c5cfc" stroke-width="2.5"/>
  <!-- Star badge -->
  <rect x="80" y="922" width="220" height="40" rx="20" fill="#7c5cfc"/>
  <text x="190" y="948" font-family="Arial Black, sans-serif" font-weight="900" font-size="20" fill="#fff" text-anchor="middle">⭐ MAIS PEDIDO</text>
  <text x="180" y="1016" font-family="Arial Black, sans-serif" font-weight="900" font-size="36" fill="#f0f0f5">Pacote Profissional</text>
  <text x="180" y="1058" font-family="Arial, sans-serif" font-size="24" fill="#c4b5fd">Site completo · Depoimentos · Formulário</text>
  <text x="180" y="1098" font-family="Arial, sans-serif" font-size="20" fill="#8888a0" text-decoration="line-through">R$ 2.000,00</text>
  <text x="840" y="1062" font-family="Arial Black, sans-serif" font-weight="900" font-size="44" fill="#a78bfa" text-anchor="middle">R$999</text>
  <text x="900" y="1098" font-family="Arial, sans-serif" font-size="20" fill="#8888a0">,90</text>

  <!-- Card 3: Completo -->
  <rect x="80" y="1172" width="920" height="180" rx="20" fill="rgba(255,255,255,0.03)"/>
  <rect x="80" y="1172" width="920" height="180" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="180" y="1244" font-family="Arial Black, sans-serif" font-weight="900" font-size="36" fill="#f0f0f5">Pacote Completo</text>
  <text x="180" y="1284" font-family="Arial, sans-serif" font-size="24" fill="#8888a0">Multi-página · Blog · Galeria · Manutenção</text>
  <text x="180" y="1324" font-family="Arial, sans-serif" font-size="20" fill="#8888a0" text-decoration="line-through">R$ 3.000,00</text>
  <text x="820" y="1300" font-family="Arial Black, sans-serif" font-weight="900" font-size="44" fill="#22c55e" text-anchor="middle">R$ 1.499,90</text>

  <!-- Common features -->
  <text x="540" y="1420" font-family="Arial, sans-serif" font-size="26" fill="#8888a0" text-anchor="middle">Todos os pacotes incluem:</text>
  <text x="540" y="1462" font-family="Arial, sans-serif" font-size="28" fill="#f0f0f5" text-anchor="middle">✓ Mobile · ✓ SEO · ✓ 3 meses suporte</text>

  <!-- CTA -->
  <rect x="100" y="1530" width="880" height="120" rx="60" fill="url(#cta-btn)"/>
  <text x="540" y="1598" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle">Pedir orçamento grátis →</text>
  <text x="540" y="1638" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.8)" text-anchor="middle">(21) 97134-9275</text>

  <text x="540" y="1740" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#a78bfa" text-anchor="middle">helphstudio.com.br</text>
  <text x="540" y="1860" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" text-anchor="middle" opacity="0.4">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
</svg>
