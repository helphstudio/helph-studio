<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.04"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="#0a0a0f"/>
  <rect width="1080" height="1080" fill="url(#bg-glow)"/>
  <circle cx="980" cy="80" r="220" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.1"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#top-bar)"/>

  <!-- Header -->
  <text x="540" y="90" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#a78bfa" letter-spacing="4" text-anchor="middle">POR QUE ESCOLHER A HELPH STUDIO?</text>
  <text x="540" y="158" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="72" fill="#f0f0f5" text-anchor="middle">Nossos diferenciais</text>
  <rect x="440" y="172" width="200" height="4" rx="2" fill="#7c5cfc" opacity="0.7"/>

  <!-- 2x2 grid of differentials -->
  <!-- Card 1: 7 dias -->
  <rect x="60" y="210" width="460" height="340" rx="20" fill="url(#card-bg)"/>
  <rect x="60" y="210" width="460" height="340" rx="20" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1.5"/>
  <text x="280" y="310" font-family="Arial, sans-serif" font-size="80" text-anchor="middle">⚡</text>
  <text x="280" y="385" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="#a78bfa" text-anchor="middle">Entrega em 7 dias</text>
  <text x="280" y="424" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">Do briefing ao site no ar.</text>
  <text x="280" y="454" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">Rápido sem perder qualidade.</text>
  <text x="280" y="516" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#22c55e" text-anchor="middle">✓ Prazo garantido</text>

  <!-- Card 2: Design exclusivo -->
  <rect x="560" y="210" width="460" height="340" rx="20" fill="url(#card-bg)"/>
  <rect x="560" y="210" width="460" height="340" rx="20" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1.5"/>
  <text x="790" y="310" font-family="Arial, sans-serif" font-size="80" text-anchor="middle">🎨</text>
  <text x="790" y="385" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="#a78bfa" text-anchor="middle">Design exclusivo</text>
  <text x="790" y="424" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">Nenhum site igual ao outro.</text>
  <text x="790" y="454" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">Criado para o seu negócio.</text>
  <text x="790" y="516" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#22c55e" text-anchor="middle">✓ Sem template</text>

  <!-- Card 3: Mobile first -->
  <rect x="60" y="570" width="460" height="340" rx="20" fill="url(#card-bg)"/>
  <rect x="60" y="570" width="460" height="340" rx="20" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1.5"/>
  <text x="280" y="670" font-family="Arial, sans-serif" font-size="80" text-anchor="middle">📱</text>
  <text x="280" y="745" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="#a78bfa" text-anchor="middle">Mobile-first</text>
  <text x="280" y="784" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">Perfeito no celular,</text>
  <text x="280" y="814" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">tablet e computador.</text>
  <text x="280" y="876" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#22c55e" text-anchor="middle">✓ Responsivo</text>

  <!-- Card 4: Suporte -->
  <rect x="560" y="570" width="460" height="340" rx="20" fill="url(#card-bg)"/>
  <rect x="560" y="570" width="460" height="340" rx="20" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1.5"/>
  <text x="790" y="670" font-family="Arial, sans-serif" font-size="80" text-anchor="middle">💬</text>
  <text x="790" y="745" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="#a78bfa" text-anchor="middle">Suporte incluso</text>
  <text x="790" y="784" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">3 meses grátis.</text>
  <text x="790" y="814" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">Atendimento via WhatsApp.</text>
  <text x="790" y="876" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#22c55e" text-anchor="middle">✓ Sem custo extra</text>

  <!-- Bottom bar -->
  <rect x="0" y="980" width="1080" height="100" fill="#111118"/>
  <rect x="0" y="978" width="1080" height="2" fill="#7c5cfc" opacity="0.3"/>
  <text x="72" y="1040" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" opacity="0.9">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
  <text x="1008" y="1040" font-family="Arial, sans-serif" font-size="22" fill="#8888a0" text-anchor="end">helphstudio.com.br</text>
</svg>
