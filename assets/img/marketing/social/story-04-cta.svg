<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="whatsapp-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#128C7E"/>
      <stop offset="100%" style="stop-color:#25D366"/>
    </linearGradient>
    <linearGradient id="purple-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="#0a0a0f"/>
  <rect width="1080" height="1920" fill="url(#bg-glow)"/>
  <circle cx="540" cy="960" r="600" fill="none" stroke="#7c5cfc" stroke-width="1" opacity="0.1"/>
  <circle cx="540" cy="960" r="480" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.07"/>
  <rect x="0" y="0" width="1080" height="6" fill="url(#top-bar)"/>

  <!-- Top logo -->
  <text x="540" y="200" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="52" fill="#f0f0f5" text-anchor="middle">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>

  <!-- Main message -->
  <text x="540" y="480" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#a78bfa" letter-spacing="4" text-anchor="middle">VAMOS COMEÇAR?</text>
  <text x="540" y="620" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="110" fill="#f0f0f5" text-anchor="middle" letter-spacing="-3">Pronto</text>
  <text x="540" y="740" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="110" fill="#f0f0f5" text-anchor="middle" letter-spacing="-3">para ter</text>
  <text x="540" y="860" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="110" fill="#a78bfa" text-anchor="middle" letter-spacing="-3">presença</text>
  <text x="540" y="980" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="110" fill="#f0f0f5" text-anchor="middle" letter-spacing="-3">digital?</text>

  <rect x="340" y="1010" width="400" height="5" rx="2.5" fill="#7c5cfc"/>

  <text x="540" y="1076" font-family="Arial, sans-serif" font-size="34" fill="#8888a0" text-anchor="middle">Orçamento gratuito.</text>
  <text x="540" y="1120" font-family="Arial, sans-serif" font-size="34" fill="#8888a0" text-anchor="middle">Sem compromisso.</text>

  <!-- What's included -->
  <text x="540" y="1210" font-family="Arial, sans-serif" font-size="30" fill="#f0f0f5" text-anchor="middle">✓ Sites profissionais</text>
  <text x="540" y="1256" font-family="Arial, sans-serif" font-size="30" fill="#f0f0f5" text-anchor="middle">✓ Helph Booking</text>
  <text x="540" y="1302" font-family="Arial, sans-serif" font-size="30" fill="#f0f0f5" text-anchor="middle">✓ Apps sob medida</text>

  <!-- WhatsApp CTA -->
  <rect x="100" y="1380" width="880" height="120" rx="60" fill="url(#whatsapp-btn)"/>
  <text x="540" y="1445" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle">💬 Chamar no WhatsApp</text>
  <text x="540" y="1485" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.85)" text-anchor="middle">(21) 97134-9275</text>

  <!-- Site URL -->
  <rect x="240" y="1560" width="600" height="72" rx="36" fill="url(#purple-btn)" opacity="0.15"/>
  <rect x="240" y="1560" width="600" height="72" rx="36" fill="none" stroke="#7c5cfc" stroke-width="2" opacity="0.5"/>
  <text x="540" y="1604" font-family="Arial Black, sans-serif" font-weight="700" font-size="32" fill="#a78bfa" text-anchor="middle">helphstudio.com.br</text>

  <!-- Social links -->
  <text x="540" y="1720" font-family="Arial, sans-serif" font-size="26" fill="#8888a0" text-anchor="middle">@helphstudio</text>
  <text x="540" y="1754" font-family="Arial, sans-serif" font-size="22" fill="#8888a0" text-anchor="middle">Instagram · Facebook · Linktree</text>

  <!-- Bottom -->
  <text x="540" y="1860" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" text-anchor="middle" opacity="0.4">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
</svg>
