<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
    <clipPath id="screen-clip">
      <rect x="80" y="310" width="920" height="560" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1080" fill="#0a0a0f"/>
  <rect width="1080" height="1080" fill="url(#bg-glow)"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#top-bar)"/>

  <!-- Label -->
  <text x="72" y="72" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#a78bfa" letter-spacing="4">NOSSO PORTFÓLIO</text>

  <!-- Headline -->
  <text x="72" y="148" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="76" fill="#f0f0f5" letter-spacing="-1">Sites que geram</text>
  <text x="72" y="228" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="76" fill="#a78bfa" letter-spacing="-1">resultados reais.</text>

  <!-- Browser chrome frame -->
  <rect x="72" y="262" width="936" height="624" rx="20" fill="#111118"/>
  <rect x="72" y="262" width="936" height="624" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Browser top bar -->
  <rect x="72" y="262" width="936" height="48" rx="0" fill="rgba(255,255,255,0.04)"/>
  <rect x="72" y="262" width="936" height="20" rx="20" fill="rgba(255,255,255,0.04)"/>
  <!-- Traffic lights -->
  <circle cx="110" cy="286" r="8" fill="#ff5f57" opacity="0.85"/>
  <circle cx="136" cy="286" r="8" fill="#febc2e" opacity="0.85"/>
  <circle cx="162" cy="286" r="8" fill="#28c840" opacity="0.85"/>
  <!-- URL bar -->
  <rect x="200" y="274" width="440" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="420" y="290" font-family="Arial, sans-serif" font-size="13" fill="#8888a0" text-anchor="middle">🔒 parperfeito.helphstudio.com.br</text>

  <!-- Screenshot real do site -->
  <image href="../../site/parperfeito-preview.jpg" x="80" y="310" width="920" height="560" preserveAspectRatio="xMidYMin slice" clip-path="url(#screen-clip)"/>

  <!-- Overlay gradient bottom of screenshot for readability -->
  <rect x="80" y="750" width="920" height="120" fill="url(#bg-glow)" opacity="0.6"/>

  <!-- Info row -->
  <text x="72" y="930" font-family="Arial Black, sans-serif" font-weight="900" font-size="34" fill="#f0f0f5">Par Perfeito — Assessoria de Casamento</text>
  <text x="72" y="968" font-family="Arial, sans-serif" font-size="24" fill="#8888a0">Pacote Completo · Site multi-página · Rio de Janeiro</text>

  <!-- Tags -->
  <rect x="72" y="984" width="180" height="36" rx="18" fill="rgba(124,92,252,0.12)"/>
  <rect x="72" y="984" width="180" height="36" rx="18" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1"/>
  <text x="162" y="1007" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#a78bfa" text-anchor="middle">Pacote Completo</text>

  <!-- Live badge -->
  <rect x="862" y="920" width="190" height="44" rx="22" fill="#22c55e" opacity="0.9"/>
  <text x="957" y="947" font-family="Arial Black, sans-serif" font-weight="900" font-size="20" fill="#fff" text-anchor="middle">● AO VIVO</text>

  <!-- Bottom bar -->
  <rect x="0" y="1030" width="1080" height="50" fill="#111118"/>
  <rect x="0" y="1028" width="1080" height="2" fill="#7c5cfc" opacity="0.3"/>
  <text x="72" y="1057" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="28" fill="#f0f0f5" opacity="0.9">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
  <text x="1008" y="1057" font-family="Arial, sans-serif" font-size="20" fill="#8888a0" text-anchor="end">helphstudio.com.br</text>
</svg>
