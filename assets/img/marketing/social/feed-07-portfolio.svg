  <circle cx="900" cy="498" r="100" fill="rgba(236,72,153,0.08)"/>
  <text x="300" y="470" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="#f0f0f5">O dia mais especial</text>
  <text x="300" y="515" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="#f9a8d4">da sua vida</text>
  <text x="300" y="560" font-family="Arial, sans-serif" font-size="18" fill="#8888a0">Assessoria de casamento no Rio de Janeiro</text>
  <rect x="300" y="578" width="160" height="36" rx="18" fill="#ec4899" opacity="0.9"/>
  <text x="380" y="602" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#fff" text-anchor="middle">Saiba mais →</text>

  <!-- Services row mockup -->
  <rect x="72" y="598" width="936" height="100" fill="rgba(255,255,255,0.02)"/>
  <rect x="112" y="618" width="180" height="60" rx="12" fill="rgba(236,72,153,0.1)"/>
  <text x="202" y="654" font-family="Arial, sans-serif" font-size="16" fill="#f9a8d4" text-anchor="middle">💍 Cerimônia</text>
  <rect x="310" y="618" width="180" height="60" rx="12" fill="rgba(236,72,153,0.1)"/>
  <text x="400" y="654" font-family="Arial, sans-serif" font-size="16" fill="#f9a8d4" text-anchor="middle">🌸 Decoração</text>
  <rect x="508" y="618" width="180" height="60" rx="12" fill="rgba(236,72,153,0.1)"/>
  <text x="598" y="654" font-family="Arial, sans-serif" font-size="16" fill="#f9a8d4" text-anchor="middle">📸 Fotos</text>
  <rect x="706" y="618" width="180" height="60" rx="12" fill="rgba(236,72,153,0.1)"/>
  <text x="796" y="654" font-family="Arial, sans-serif" font-size="16" fill="#f9a8d4" text-anchor="middle">🎊 Recepção</text>

  <!-- "Ao vivo" badge -->
  <rect x="840" y="710" width="148" height="40" rx="20" fill="#22c55e" opacity="0.9"/>
  <text x="914" y="735" font-family="Arial Black, sans-serif" font-weight="700" font-size="18" fill="#fff" text-anchor="middle">● AO VIVO</text>

  <!-- Info below card -->
  <text x="72" y="912" font-family="Arial Black, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5">Par Perfeito</text>
  <text x="72" y="948" font-family="Arial, sans-serif" font-size="24" fill="#8888a0">Assessoria de Casamento · Pacote Completo · RJ</text>
  <text x="1008" y="948" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#a78bfa" text-anchor="end">parperfeito.helphstudio.com.br →</text>

  <!-- Bottom bar -->
  <rect x="0" y="980" width="1080" height="100" fill="#111118"/>
  <rect x="0" y="978" width="1080" height="2" fill="#7c5cfc" opacity="0.3"/>
  <text x="72" y="1040" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" opacity="0.9">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
  <text x="1008" y="1040" font-family="Arial, sans-serif" font-size="22" fill="#8888a0" text-anchor="end">helphstudio.com.br</text>
