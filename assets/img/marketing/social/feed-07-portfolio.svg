  <text x="72" y="168" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="76" fill="#f0f0f5" letter-spacing="-1">Sites que geram</text>
  <text x="72" y="252" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="76" fill="#a78bfa" letter-spacing="-1">resultados reais.</text>

  <!-- Client card: Par Perfeito -->
  <rect x="72" y="290" width="936" height="580" rx="24" fill="url(#site-preview)"/>
  <rect x="72" y="290" width="936" height="580" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Browser bar mockup -->
  <rect x="72" y="290" width="936" height="44" rx="0" fill="rgba(255,255,255,0.04)"/>
  <circle cx="108" cy="312" r="7" fill="#ff5f57" opacity="0.8"/>
  <circle cx="132" cy="312" r="7" fill="#febc2e" opacity="0.8"/>
  <circle cx="156" cy="312" r="7" fill="#28c840" opacity="0.8"/>
  <rect x="200" y="302" width="400" height="20" rx="10" fill="rgba(255,255,255,0.06)"/>
  <text x="400" y="317" font-family="Arial, sans-serif" font-size="14" fill="#8888a0" text-anchor="middle">parperfeito.helphstudio.com.br</text>

  <!-- Site content mockup - header -->
  <rect x="72" y="334" width="936" height="64" fill="rgba(255,220,230,0.06)"/>
  <text x="200" y="374" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#f9a8d4">Par Perfeito</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="15" fill="#f9a8d4" opacity="0.6">Assessoria de Casamento</text>
  <rect x="750" y="352" width="160" height="32" rx="16" fill="#ec4899" opacity="0.8"/>
  <text x="830" y="373" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#fff" text-anchor="middle">Contato</text>

  <!-- Hero area mockup -->
  <rect x="72" y="398" width="936" height="200" fill="rgba(244,114,180,0.05)"/>
