  <circle cx="900" cy="120" r="260" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.1"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#top-bar)"/>

  <!-- Label -->
  <text x="72" y="90" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#a78bfa" letter-spacing="4">NOSSO PORTFÓLIO</text>

