<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="60%" style="stop-color:#7dd3fc"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="stat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="#0a0a0f"/>
  <rect width="1080" height="1080" fill="url(#bg-glow)"/>
  <circle cx="980" cy="100" r="250" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.1"/>
  <circle cx="100" cy="980" r="220" fill="none" stroke="#7c5cfc" stroke-width="1" opacity="0.08"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#top-bar)"/>

  <!-- Product name -->
  <text x="72" y="120" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="22" fill="#8888a0" letter-spacing="4">APRESENTANDO</text>
  <text x="72" y="200" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="100" fill="#f0f0f5" letter-spacing="-3">Hel<tspan fill="#a78bfa">ph</tspan> <tspan fill="#7dd3fc">Booking</tspan></text>

  <!-- Headline -->
  <text x="72" y="295" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="64" fill="#f0f0f5" letter-spacing="-1">Seu cliente agenda.</text>
  <text x="72" y="368" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="64" fill="#a78bfa" letter-spacing="-1">Você só atende.</text>

  <!-- Description -->
  <text x="72" y="430" font-family="Arial, sans-serif" font-size="26" fill="#8888a0">Sistema de agendamento com a cara do</text>
  <text x="72" y="462" font-family="Arial, sans-serif" font-size="26" fill="#8888a0">seu negócio — sem App Store.</text>

  <!-- Stats grid 2x2 -->
  <!-- Stat 1 -->
  <rect x="72" y="500" width="222" height="130" rx="16" fill="url(#stat-bg)"/>
  <rect x="72" y="500" width="222" height="130" rx="16" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1.5"/>
  <text x="183" y="562" font-family="Arial Black, sans-serif" font-weight="900" font-size="48" fill="#a78bfa" text-anchor="middle">4</text>
  <text x="183" y="598" font-family="Arial, sans-serif" font-size="19" fill="#8888a0" text-anchor="middle">etapas p/ agendar</text>

  <!-- Stat 2 -->
  <rect x="310" y="500" width="222" height="130" rx="16" fill="url(#stat-bg)"/>
  <rect x="310" y="500" width="222" height="130" rx="16" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1.5"/>
  <text x="421" y="562" font-family="Arial Black, sans-serif" font-weight="900" font-size="48" fill="#22c55e" text-anchor="middle">100%</text>
  <text x="421" y="598" font-family="Arial, sans-serif" font-size="19" fill="#8888a0" text-anchor="middle">funciona offline</text>

  <!-- Stat 3 -->
  <rect x="72" y="648" width="222" height="130" rx="16" fill="url(#stat-bg)"/>
  <rect x="72" y="648" width="222" height="130" rx="16" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1.5"/>
  <text x="183" y="710" font-family="Arial Black, sans-serif" font-weight="900" font-size="48" fill="#7dd3fc" text-anchor="middle">Zero</text>
  <text x="183" y="746" font-family="Arial, sans-serif" font-size="19" fill="#8888a0" text-anchor="middle">instalação na loja</text>

  <!-- Stat 4 -->
  <rect x="310" y="648" width="222" height="130" rx="16" fill="url(#stat-bg)"/>
  <rect x="310" y="648" width="222" height="130" rx="16" fill="none" stroke="rgba(124,92,252,0.3)" stroke-width="1.5"/>
  <text x="421" y="700" font-family="Arial Black, sans-serif" font-weight="900" font-size="38" fill="#22c55e" text-anchor="middle">R$39,90</text>
  <text x="421" y="734" font-family="Arial, sans-serif" font-size="19" fill="#8888a0" text-anchor="middle">/mês sem fidelidade</text>

  <!-- Right side: segments -->
  <text x="620" y="530" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#a78bfa" letter-spacing="2">IDEAL PARA</text>
  <text x="620" y="574" font-family="Arial, sans-serif" font-size="26" fill="#f0f0f5">✂️ Barbearias e salões</text>
  <text x="620" y="618" font-family="Arial, sans-serif" font-size="26" fill="#f0f0f5">🏥 Clínicas e estéticas</text>
  <text x="620" y="662" font-family="Arial, sans-serif" font-size="26" fill="#f0f0f5">🐾 Pet shops</text>
  <text x="620" y="706" font-family="Arial, sans-serif" font-size="26" fill="#f0f0f5">🏋️ Personal trainers</text>
  <text x="620" y="750" font-family="Arial, sans-serif" font-size="26" fill="#f0f0f5">💆 Spas e massagens</text>
  <text x="620" y="794" font-family="Arial, sans-serif" font-size="26" fill="#8888a0">+ qualquer hora marcada</text>

  <!-- Demo link -->
  <rect x="72" y="810" width="460" height="56" rx="28" fill="rgba(124,92,252,0.12)"/>
  <rect x="72" y="810" width="460" height="56" rx="28" fill="none" stroke="#7c5cfc" stroke-width="1.5" opacity="0.5"/>
  <text x="302" y="845" font-family="Arial Black, sans-serif" font-weight="700" font-size="24" fill="#a78bfa" text-anchor="middle">👉 booking.helphstudio.com.br</text>

  <!-- Bottom bar -->
  <rect x="0" y="980" width="1080" height="100" fill="#111118"/>
  <rect x="0" y="978" width="1080" height="2" fill="#7c5cfc" opacity="0.3"/>
  <text x="72" y="1040" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" opacity="0.9">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
  <text x="1008" y="1040" font-family="Arial, sans-serif" font-size="22" fill="#8888a0" text-anchor="end">helphstudio.com.br</text>
</svg>
