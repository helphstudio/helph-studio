<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="btn-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="#0a0a0f"/>
  <rect width="1080" height="1080" fill="url(#bg-glow)"/>
  <circle cx="920" cy="160" r="300" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.1"/>
  <circle cx="160" cy="920" r="260" fill="none" stroke="#7c5cfc" stroke-width="1" opacity="0.08"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#top-bar)"/>

  <!-- Label -->
  <text x="540" y="120" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#a78bfa" letter-spacing="4" text-anchor="middle">VAMOS CONVERSAR?</text>

  <!-- Main headline -->
  <text x="540" y="270" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="84" fill="#f0f0f5" text-anchor="middle">Pronto para ter</text>
  <text x="540" y="365" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="84" fill="#a78bfa" text-anchor="middle">presença digital</text>
  <text x="540" y="460" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="84" fill="#f0f0f5" text-anchor="middle">profissional?</text>

  <rect x="440" y="488" width="200" height="4" rx="2" fill="#7c5cfc"/>

  <!-- Sub text -->
  <text x="540" y="546" font-family="Arial, sans-serif" font-size="30" fill="#8888a0" text-anchor="middle">Orçamento sem compromisso.</text>
  <text x="540" y="586" font-family="Arial, sans-serif" font-size="30" fill="#8888a0" text-anchor="middle">Entrega em até 7 dias. Suporte incluso.</text>

  <!-- Services check list -->
  <text x="540" y="650" font-family="Arial, sans-serif" font-size="26" fill="#f0f0f5" text-anchor="middle">✓ Sites  ·  ✓ Helph Booking  ·  ✓ Apps sob medida</text>

  <!-- WhatsApp button — botão único com texto centralizado -->
  <rect x="120" y="694" width="840" height="100" rx="50" fill="url(#btn-green)"/>
  <text x="540" y="745" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle">💬 Chamar no WhatsApp</text>
  <text x="540" y="780" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.85)" text-anchor="middle">(21) 97134-9275</text>

  <!-- URL -->
  <rect x="290" y="824" width="500" height="62" rx="31" fill="rgba(124,92,252,0.1)"/>
  <rect x="290" y="824" width="500" height="62" rx="31" fill="none" stroke="#7c5cfc" stroke-width="1.5" opacity="0.4"/>
  <text x="540" y="862" font-family="Arial Black, sans-serif" font-weight="700" font-size="26" fill="#a78bfa" text-anchor="middle">helphstudio.com.br</text>

  <!-- Social -->
  <text x="540" y="940" font-family="Arial, sans-serif" font-size="24" fill="#8888a0" text-anchor="middle">@helphstudio · Instagram · Facebook · Linktree</text>

  <!-- Bottom bar -->
  <rect x="0" y="980" width="1080" height="100" fill="#111118"/>
  <rect x="0" y="978" width="1080" height="2" fill="#7c5cfc" opacity="0.3"/>
  <text x="72" y="1040" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" fill="#f0f0f5" opacity="0.9">Hel<tspan fill="#a78bfa">ph</tspan> Studio</text>
  <text x="1008" y="1040" font-family="Arial, sans-serif" font-size="22" fill="#8888a0" text-anchor="end">@helphstudio</text>
</svg>
