<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- "Helph Studio" text — matching site style -->
  <!-- Line 1: Helph -->
  <text x="256" y="230" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-weight="900"
        font-size="108"
        letter-spacing="-4"
        fill="#f0f0f5">Hel<tspan fill="#a78bfa">ph</tspan></text>

  <!-- Line 2: Studio -->
  <text x="256" y="330" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-weight="900"
        font-size="108"
        letter-spacing="-4"
        fill="#f0f0f5">Studio</text>
</svg>
