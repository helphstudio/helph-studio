<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Glow spot -->
  <rect width="1600" height="900" fill="url(#spot)"/>

  <!-- Decorative circles -->
  <circle cx="1400" cy="130" r="220" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.15"/>
  <circle cx="1400" cy="130" r="160" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.1"/>
  <circle cx="200" cy="800" r="180" fill="none" stroke="#7c5cfc" stroke-width="1.5" opacity="0.12"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1600" height="4" fill="url(#glow)"/>
  <rect x="0" y="0" width="320" height="4" fill="#7c5cfc" opacity="0.9"/>

  <!-- Logo wordmark -->
  <text x="120" y="420"
        font-family="Arial Black, Impact, sans-serif"
        font-weight="900"
        font-size="160"
        letter-spacing="-6"
        fill="#f0f0f5">Hel<tspan fill="#a78bfa">ph</tspan></text>

  <text x="120" y="580"
        font-family="Arial Black, Impact, sans-serif"
        font-weight="900"
        font-size="160"
        letter-spacing="-6"
        fill="#f0f0f5">Studio</text>

  <!-- Tagline -->
  <text x="120" y="660"
        font-family="Arial, sans-serif"
        font-weight="400"
        font-size="32"
        fill="#8888a0"
        letter-spacing="2">Sites profissionais para negócios, autônomos e freelancers.</text>

  <!-- Divider -->
  <rect x="120" y="690" width="80" height="3" rx="2" fill="#7c5cfc" opacity="0.8"/>

  <!-- Contact info -->
  <text x="120" y="750"
        font-family="Arial, sans-serif"
        font-weight="600"
        font-size="28"
        fill="#a78bfa"
        letter-spacing="0.5">helphstudio@gmail.com  ·  (21) 97134-9275</text>
</svg>
